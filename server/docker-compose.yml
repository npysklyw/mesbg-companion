services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mesbg
      POSTGRES_USER: mesbg
      POSTGRES_PASSWORD: mesbg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesbg"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://mesbg:mesbg@db:5432/mesbg
      CORS_ORIGINS: http://localhost:8081,http://localhost:8082
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
